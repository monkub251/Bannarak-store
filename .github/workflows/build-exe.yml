name: Build EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      # คอมไพล์ bootloader ของ PyInstaller เอง (ลดโอกาสโดนตีว่าเป็นไวรัส)
      - name: Build PyInstaller from source
        shell: cmd
        run: |
          git clone --depth 1 --branch v6.11.1 https://github.com/pyinstaller/pyinstaller.git pyi_src
          cd pyi_src\bootloader
          python ./waf all
          cd ..
          python -m pip install .

      - name: Build
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --noupx --name FiveM_FPS_Optimizer --icon assets\icon.ico --add-data "assets;assets" --add-data "pack;pack" --add-data "cache;cache" --add-data "gifs;gifs" --exclude-module tkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FiveM_FPS_Optimizer
          path: dist/FiveM_FPS_Optimizer
