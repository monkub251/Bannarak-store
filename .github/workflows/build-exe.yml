name: build-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements file found, installing defaults"
            pip install PySide6
          fi
          pip install pyinstaller pytest

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No tests folder, skipping"
          fi

      - name: Build exe
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name BANNARAKX_UNIFIED --icon assets/logo.ico
          --add-data "assets;assets"
          --distpath dist/BANNARAKX_UNIFIED --workpath build run.py

      - name: Copy originals
        shell: bash
        run: |
          if [ -d originals ]; then
            cp -r originals dist/BANNARAKX_UNIFIED/originals
          else
            echo "No originals folder, skipping"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BANNARAKX_UNIFIED
          path: dist/BANNARAKX_UNIFIED
          if-no-files-found: error
