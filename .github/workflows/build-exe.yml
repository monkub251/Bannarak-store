name: build-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      APP_NAME: BANNARAKX_UNIFIED
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repo files
        run: |
          ls -la
          find . -name "*.py" -not -path "./.git/*" -not -path "*/venv/*" -not -path "*/.venv/*" | head -100

      - name: Detect app folder and entry point
        run: |
          ENTRY=""
          for n in run.py main.py app.py; do
            f=$(find . -maxdepth 3 -name "$n" -not -path "./.git/*" -not -path "*/venv/*" -not -path "*/.venv/*" -not -path "*/tests/*" | head -1)
            [ -n "$f" ] && ENTRY="$f" && break
          done
          if [ -z "$ENTRY" ]; then
            ENTRY=$(grep -rlE "QApplication" --include="*.py" . \
              --exclude-dir=.git --exclude-dir=venv --exclude-dir=.venv \
              --exclude-dir=tests --exclude-dir=build --exclude-dir=dist 2>/dev/null | head -1)
          fi
          if [ -z "$ENTRY" ]; then
            echo "::error::No desktop app entry point found in this repo. Put this workflow in the repo that contains run.py."
            exit 1
          fi
          ENTRY="${ENTRY#./}"
          APP_DIR=$(dirname "$ENTRY")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "ENTRY_FILE=$(basename "$ENTRY")" >> "$GITHUB_ENV"
          echo "Entry: $ENTRY | Folder: $APP_DIR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd "$APP_DIR"
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then pip install -r requirements.txt
          elif [ -f "$GITHUB_WORKSPACE/requirements-dev.txt" ]; then pip install -r "$GITHUB_WORKSPACE/requirements-dev.txt"
          elif [ -f "$GITHUB_WORKSPACE/requirements.txt" ]; then pip install -r "$GITHUB_WORKSPACE/requirements.txt"
          else pip install PySide6
          fi
          pip install pyinstaller pytest

      - name: Run tests
        run: |
          cd "$APP_DIR"
          if [ -d tests ]; then
            python -m pytest -q tests || [ $? -eq 5 ]
          else
            echo "No tests folder, skipping"
          fi

      - name: Build exe
        run: |
          cd "$APP_DIR"
          ARGS=(--noconfirm --clean --onefile --windowed --uac-admin
                --name "$APP_NAME"
                --distpath "$GITHUB_WORKSPACE/dist/$APP_NAME"
                --workpath build)
          ICON=""
          if [ -f assets/logo.ico ]; then ICON="assets/logo.ico"
          else ICON=$(find . -name "*.ico" -not -path "*/venv/*" -not -path "*/.venv/*" | head -1); fi
          [ -n "$ICON" ] && ARGS+=(--icon "$ICON")
          [ -d assets ] && ARGS+=(--add-data "assets;assets")
          pyinstaller "${ARGS[@]}" "$ENTRY_FILE"

      - name: Copy originals
        run: |
          if [ -d "$APP_DIR/originals" ]; then
            cp -r "$APP_DIR/originals" "$GITHUB_WORKSPACE/dist/$APP_NAME/originals"
          else
            echo "No originals folder, skipping"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BANNARAKX_UNIFIED
          path: dist/BANNARAKX_UNIFIED
          if-no-files-found: error
