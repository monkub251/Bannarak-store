
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect repository
        shell: pwsh
        run: |
          Write-Host "Repository root: $PWD"
          Get-ChildItem -Force
          Write-Host "Searching dependency files..."
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -in @(
                "requirements.txt",
                "pyproject.toml",
                "Pipfile"
              )
            } |
            Select-Object -ExpandProperty FullName

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip."
          }

          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install PyInstaller."
          }

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          elseif (Test-Path "BANNARAKX_UNIFIED/requirements.txt") {
            python -m pip install -r BANNARAKX_UNIFIED/requirements.txt
          }
          elseif (Test-Path "pyproject.toml") {
            python -m pip install .
          }
          else {
            Write-Host "::warning::No dependency manifest found. Only PyInstaller is installed."
            Write-Host "Install the application's actual dependencies before building."
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }
