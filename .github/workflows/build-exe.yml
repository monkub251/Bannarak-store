
      - name: Find Python entry points
        shell: pwsh
        run: |
          Write-Host "=== Repository files ==="
          Get-ChildItem -Force

          Write-Host "=== Python files ==="
          Get-ChildItem -Recurse -File -Filter *.py |
            Where-Object {
              $_.FullName -notmatch '\\.git\\|\\venv\\|\\__pycache__\\'
            } |
            ForEach-Object {
              Write-Host $_.FullName.Replace("$PWD\", "")
            }

          Write-Host "=== Project configuration ==="
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -in @(
                "*.spec",
                "pyproject.toml",
                "setup.py"
              )
            } |
            Select-Object -ExpandProperty FullName
