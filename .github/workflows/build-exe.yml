name: Build EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unzip and find app folder
        shell: pwsh
        run: |
          Get-ChildItem *.zip -ErrorAction SilentlyContinue | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath "_src" -Force }
          $m = Get-ChildItem -Recurse -Filter main.py | Where-Object { Test-Path (Join-Path $_.DirectoryName 'app') } | Select-Object -First 1
          if (-not $m) { Get-ChildItem -Recurse -Depth 2 | Select-Object -First 60 FullName; Write-Error "ไม่พบ main.py"; exit 1 }
          "APP_DIR=$($m.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APP_DIR = $($m.DirectoryName)"

      - run: python -m pip install PySide6-Essentials numpy pyinstaller

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --noupx --name FiveM_FPS_Optimizer --icon assets\icon.ico --add-data "assets;assets" --add-data "pack;pack" --add-data "cache;cache" --add-data "gifs;gifs" --exclude-module tkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FiveM_FPS_Optimizer
          path: ${{ env.APP_DIR }}/dist/FiveM_FPS_Optimizer
