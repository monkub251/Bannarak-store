name: build-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen   # กัน pytest พังเพราะไม่มีหน้าจอ (PySide6)
      PYTHONUTF8: "1"              # กัน error ภาษาไทย/unicode ใน console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build exe
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name BANNARAKX_UNIFIED --icon assets/logo.ico
          --add-data "assets;assets"
          --distpath dist/BANNARAKX_UNIFIED --workpath build run.py

      - name: Copy originals
        shell: cmd
        run: xcopy /E /I /Y originals dist\BANNARAKX_UNIFIED\originals

      - uses: actions/upload-artifact@v4
        with:
          name: BANNARAKX_UNIFIED
          path: dist/BANNARAKX_UNIFIED
          if-no-files-found: error
