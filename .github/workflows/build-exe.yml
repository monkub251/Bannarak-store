name: Build EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  APP_DIR: "."          # ถ้าไฟล์อยู่ในโฟลเดอร์ย่อย ให้ใส่ชื่อโฟลเดอร์ เช่น fivem_optimizer
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check files
        shell: cmd
        run: dir
      - run: python -m pip install PySide6-Essentials numpy pyinstaller

      - name: Build
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin --noupx --name FiveM_FPS_Optimizer --icon assets\icon.ico --add-data "assets;assets" --add-data "pack;pack" --add-data "cache;cache" --add-data "gifs;gifs" --exclude-module tkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FiveM_FPS_Optimizer
          path: ${{ env.APP_DIR }}/dist/FiveM_FPS_Optimizer
